name: Test

on: [push]

jobs:
  run_tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't let one bad combination cancel the rest of the matrix.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: "18.6"
            device: "iPhone 16 Plus"
            xcode: "16.4"
          - runner: macos-15
            os: "26.1"
            device: "iPhone 16"
            xcode: "26.1.1"
          - runner: macos-15
            os: "26.1"
            device: "iPhone 16 Pro"
            xcode: "26.1.1"
          - runner: macos-15
            os: "26.2"
            device: "iPad Pro 13-inch (M5)"
            xcode: "26.2"

    name: "iOS ${{ matrix.os }} · ${{ matrix.device }} (Xcode ${{ matrix.xcode }})"

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Resolve the simulator UDID instead of relying on name + OS string
      # matching. Runtime identifiers (iOS-26-0) omit the patch component,
      # so this is immune to the 26.0 vs 26.0.1 mismatch. If the combination
      # has been rotated out of the image, this step fails here with a
      # readable device list rather than deep inside xcodebuild output.
      - name: Resolve simulator
        id: sim
        run: |
          set -euo pipefail
          echo "--- Available iOS runtimes ---"
          xcrun simctl list runtimes ios

          udid=$(xcrun simctl list devices available --json | jq -er \
            --arg name '${{ matrix.device }}' \
            --arg os   '${{ matrix.os }}' '
              [ .devices
                | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-" + ($os | gsub("\\."; "-")) + "$"))
                | .value[]
                | select(.name == $name)
                | .udid
              ][0]
            ') || {
              echo "::error::No '${{ matrix.device }}' on iOS ${{ matrix.os }}. Available devices:"
              xcrun simctl list devices available
              exit 1
            }

          echo "Resolved ${{ matrix.device }} / iOS ${{ matrix.os }} -> $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Spellbook \
            -project Spellbook.xcodeproj \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            | xcbeautify --renderer github-actions
